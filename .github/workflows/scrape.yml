name: Extracción programada y actualización del tablero

# Corre todos los miércoles a las 19:00 UTC (2:00 p. m. en Colombia) y
# también se puede lanzar a mano desde la pestaña Actions.
# Ventana del curso: la última ejecución válida es el 9 de diciembre de 2026.
on:
  schedule:
    - cron: "0 19 * * 3"
  workflow_dispatch:

permissions:
  contents: write   # para versionar el CSV, las métricas y el tablero
  pages: write      # para publicar el resultado en GitHub Pages
  id-token: write   # requerido por actions/deploy-pages

concurrency:
  group: extraccion-programada
  cancel-in-progress: false

env:
  EA3_PAGES: ${{ vars.EA3_PAGES || '2' }}
  EA3_VIGENCIA_HASTA: ${{ vars.EA3_VIGENCIA_HASTA || '2026-12-09' }}

jobs:
  actualizar:
    name: Extraer, validar, versionar y publicar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Comprobar la vigencia de la automatización
        run: |
          HOY=$(date +%Y-%m-%d)
          if [[ "$HOY" > "$EA3_VIGENCIA_HASTA" ]]; then
            echo "La ventana de automatización terminó el $EA3_VIGENCIA_HASTA."
            exit 1
          fi
          echo "Ejecución válida: $HOY (límite $EA3_VIGENCIA_HASTA)."

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar el pipeline (extracción, validación y tablero)
        run: PYTHONPATH=src python -m ea3.pipeline

      - name: Versionar los resultados
        env:
          # GITHUB_TOKEN lo crea GitHub en cada ejecución: no hay que
          # guardarlo en el repositorio. Se usa como secreto del workflow.
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/productos.csv data/metricas.json report/index.html
          git diff --cached --quiet && echo "Sin cambios en los datos." && exit 0
          git commit -m "auto(datos): actualización semanal del catálogo y del tablero"
          git push https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git HEAD:main

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Empaquetar el sitio actualizado
        uses: actions/upload-pages-artifact@v5
        with:
          path: report

      - name: Esperar a que el artefacto esté disponible
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for intento in $(seq 1 12); do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
                --jq '.artifacts[] | select(.name == "github-pages") | .id' | grep -q .; then
              echo "Artefacto github-pages disponible (intento ${intento})."
              exit 0
            fi
            echo "Intento ${intento}: el artefacto aún no aparece; espero 10 s."
            sleep 10
          done
          echo "El artefacto no apareció en dos minutos." >&2
          exit 1

      - name: Publicar el tablero
        id: despliegue
        uses: actions/deploy-pages@v5
