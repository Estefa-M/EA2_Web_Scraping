name: Despliegue del tablero (CD)

# Cada push a main pasa otra vez por las pruebas y, solo si quedan en verde,
# publica el tablero en GitHub Pages. El entorno queda asociado a la URL
# pública que GitHub muestra en el job y en la pestaña Deployments.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  calidad:
    name: Verificar antes de desplegar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Analizar el código
        run: ruff check .
      - name: Ejecutar las pruebas
        run: pytest -q
      - name: Validar el dataset
        run: PYTHONPATH=src python -m ea3.pipeline --check

  desplegar:
    name: Publicar en GitHub Pages
    needs: calidad
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Regenerar el tablero a partir de los datos versionados
        env:
          EA3_PAGES: ${{ vars.EA3_PAGES || '2' }}
        run: PYTHONPATH=src python -m ea3.pipeline --desde-csv data/productos.csv

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v5
        with:
          path: report

      # El API de artefactos tarda unos segundos en indexar el archivo recién
      # subido. Sin esta espera, deploy-pages consulta y recibe "Found 0
      # artifact(s)" aunque la subida haya terminado bien.
      - name: Esperar a que el artefacto esté disponible
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for intento in $(seq 1 12); do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
                --jq '.artifacts[] | select(.name == "github-pages") | .id' | grep -q .; then
              echo "Artefacto github-pages disponible (intento ${intento})."
              exit 0
            fi
            echo "Intento ${intento}: el artefacto aún no aparece; espero 10 s."
            sleep 10
          done
          echo "El artefacto no apareció en dos minutos." >&2
          exit 1

      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v5
