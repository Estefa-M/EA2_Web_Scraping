[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integracion: prueba que consulta el sitio real (se ejecuta con EA3_LIVE=1)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Los cuadernos y los generadores de documentos no se lintan: el cuaderno
# necesita imports después de ajustar sys.path y el informe es un script aparte.
extend-exclude = ["notebooks", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
